    <style>
      :root {
        color-scheme: light only;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #d3d3d3;
        color: #000;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Oxygen,
          Ubuntu,
          sans-serif;
        font-weight: 300;
      }
      .card {
        max-width: 34rem;
        margin: 3rem auto;
        padding: 2rem;
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      }
      h2 {
        margin: 0 0 1rem;
        font-weight: 400;
      }
      p {
        line-height: 1.55;
      }
      code {
        background: #eee;
        padding: 0.15em 0.4em;
        border-radius: 3px;
        font-size: 0.9em;
      }
      .meta-table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
        font-size: 0.92em;
      }
      .meta-table td {
        padding: 0.35rem 0.5rem;
        border-bottom: 1px solid #e0e0e0;
      }
      .meta-table td:first-child {
        font-weight: 400;
        white-space: nowrap;
        width: 40%;
      }
      button {
        font-family: inherit;
        font-size: 16px;
        font-weight: 400;
        color: #222;
        background: #d8d4cc;
        border: 1px solid #222;
        border-radius: 0;
        padding: 0.6em 1.4em;
        cursor: pointer;
        min-width: 7.5rem;
      }
      button:hover {
        background: #ebe7df;
        color: #772139;
        border-color: #772139;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .progress-bar {
        width: 100%;
        height: 0.5rem;
        background: #ddd;
        border-radius: 0.25rem;
        overflow: hidden;
        margin: 0.75rem 0;
      }
      .progress-bar-fill {
        height: 100%;
        background: #34d399;
        width: 0%;
        transition: width 0.2s;
      }
      .status {
        margin: 0.75rem 0;
        font-size: 0.95em;
      }
      .success {
        color: #0a7c4d;
      }
      .error {
        color: #b3261e;
      }
      .warn {
        color: #8a6d00;
      }
      .hidden {
        display: none;
      }
    </style>
